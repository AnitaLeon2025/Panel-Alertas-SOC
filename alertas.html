<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alertas | Alertas SOC</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <h1>Alertas</h1>
    <nav aria-label="Menú principal">
        <button type="button" id="btnMenu" class="btn-menu"
            aria-expanded="false" aria-controls="menuLista">
      ☰ Menú
        </button>
        <ul id="menuLista">
          <li><a href="index.html" >Panel</a></li>
          <li><a href="registrar.html">Registrar alerta</a></li>
          <li><a href="alertas.html" aria-current="page">Alertas</a></li>
        </ul>
    </nav>
  </header>

  <main>
    <section aria-labelledby="titulo-filtros">
      <h2 id="titulo-filtros">Buscar y filtrar</h2>

      <div class="campo">
        <label for="busqueda">Buscar</label>
        <input type="search" id="busqueda" placeholder="Activo o descripción">
      </div>

      <div class="campo">
        <label for="filtro-fuente">Fuente</label>
        <select id="filtro-fuente">
          <option value="">Todas</option>
          <option value="firewall">Firewall</option>
          <option value="antivirus">Antivirus</option>
          <option value="ids">IDS</option>
          <option value="correo">Correo</option>
        </select>
      </div>

      <div class="campo">
        <label for="filtro-severidad">Severidad</label>
        <select id="filtro-severidad">
          <option value="">Todas</option>
          <option value="baja">Baja</option>
          <option value="media">Media</option>
          <option value="alta">Alta</option>
          <option value="critica">Crítica</option>
        </select>
      </div>

      <div class="campo">
        <label for="filtro-estado">Estado</label>
        <select id="filtro-estado">
          <option value="">Todos</option>
          <option value="abierta">Abierta</option>
          <option value="en-revision">En revisión</option>
          <option value="cerrada">Cerrada</option>
        </select>
      </div>

      <div class="campo">
        <label for="orden">Ordenar por</label>
        <select id="orden">
          <option value="fecha-desc">Fecha (más reciente)</option>
          <option value="fecha-asc">Fecha (más antigua)</option>
          <option value="severidad">Severidad</option>
        </select>
      </div>
    </section>

    <section aria-labelledby="titulo-acciones">
      <h2 id="titulo-acciones">Datos</h2>
      <div class="acciones">
        <button type="button" id="btn-ejemplo">Cargar datos de ejemplo</button>
        <button type="button" id="btn-exportar">Exportar JSON</button>
      </div>
    </section>

    <section aria-labelledby="titulo-lista">
      <h2 id="titulo-lista">Lista de alertas</h2>
      <p id="mensaje-vacio" class="vacio" hidden>No hay alertas para mostrar. Cambia los filtros, carga datos de ejemplo o registra una alerta.</p>
      <div id="lista-alertas">
      </div>
    </section>
  </main>

  <footer><p>Programación II · Equipo 3 · UNAS</p></footer>
  <script src="js/datos.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tarjetas.js"></script>
  <script src="js/alertas.js"></script>
</body>
</html>
