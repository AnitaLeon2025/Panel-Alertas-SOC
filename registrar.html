<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'">
  <title>Registrar alerta | Alertas SOC</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <h1>Registrar Alertas</h1>
    <nav aria-label="Menú principal">
        <button type="button" id="btnMenu" class="btn-menu"
            aria-expanded="false" aria-controls="menuLista">
      ☰ Menú
        </button>
        <ul id="menuLista">
          <li><a href="index.html">Panel</a></li>
          <li><a href="registrar.html" aria-current="page">Registrar alerta</a></li>
          <li><a href="alertas.html">Alertas</a></li>
        </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2 id="titulo-form">Nueva alerta</h2>
      <p id="mensaje-exito" class="mensaje-exito" role="status"></p>
      <p id="mensaje-error-form" class="mensaje-error-form" role="alert"></p>
      <form id="formAlerta" novalidate>

        <div class="campo">
          <label for="fuente">Fuente</label>
          <select id="fuente" name="fuente" required>
            <option value="firewall">Firewall</option>
            <option value="antivirus">Antivirus</option>
            <option value="ids">IDS</option>
            <option value="correo">Correo</option>
          </select>
          <small id="error-fuente" class="error"></small>
        </div>

        <div class="campo">
          <label for="severidad">Severidad</label>
          <select id="severidad" name="severidad" required>
            <option value="baja">Baja</option>
            <option value="media">Media</option>
            <option value="alta">Alta</option>
            <option value="critica">Crítica</option>
          </select>
          <small id="error-severidad" class="error"></small>
        </div>

        <div class="campo">
          <label for="activo">Activo afectado</label>
          <input type="text" id="activo" name="activo" placeholder="Ej: SRV-WEB-01" required>
          <small id="error-activo" class="error"></small>
        </div>

        <div class="campo">
          <label for="descripcion">Descripción (10 a 300 caracteres)</label>
          <textarea id="descripcion" name="descripcion" minlength="10" maxlength="300" required></textarea>
          <small id="ayuda-descripcion" class="ayuda">0 / 300 caracteres</small>
          <small id="error-descripcion" class="error"></small>
        </div>

        <div class="campo">
          <label for="fecha">Fecha y hora</label>
          <input type="datetime-local" id="fecha" name="fecha" required>
          <small id="error-fecha" class="error"></small>
        </div>

        <div class="campo">
          <label for="responsable">Analista responsable</label>
          <input type="text" id="responsable" name="responsable" placeholder="Nombre ficticio">
          <small id="ayuda-responsable" class="ayuda">Obligatorio para cerrar una alerta crítica.</small>
          <small id="error-responsable" class="error"></small>
        </div>

        <div class="campo">
          <label for="estado">Estado</label>
          <select id="estado" name="estado" required>
            <option value="abierta">Abierta</option>
            <option value="en-revision">En revisión</option>
            <option value="cerrada">Cerrada</option>
          </select>
          <small id="error-estado" class="error"></small>
        </div>

        <div class="campo" id="grupo-nota" hidden>
          <label for="notaCierre">Nota de cierre</label>
          <textarea id="notaCierre" name="notaCierre" rows="3" maxlength="200"></textarea>
          <small id="ayuda-notaCierre" class="ayuda">Obligatoria para cerrar una alerta (5 a 200 caracteres).</small>
          <small id="error-notaCierre" class="error"></small>
        </div>

        <button type="submit" id="guardarBtn">Guardar alerta</button>
      </form>
    </section>
  </main>

  <footer><p>Programación II · Equipo 3 · UNAS</p></footer>
  <script src="js/datos.js"></script>
  <script src="js/app.js"></script>
  <script src="js/reglas.js"></script>
  <script src="js/registrar.js"></script>
</body>
</html>
